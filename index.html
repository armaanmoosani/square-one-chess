<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Square One</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive guide that teaches complete beginners how to set up and play their first game of chess.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Zilla+Slab:wght@600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#lesson-panel" id="skip-link">Skip to the lesson</a>

<header class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-controls="outline" aria-expanded="false">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span class="sr-only" data-ui="nav.menu">Lessons menu</span>
    </button>
    <a class="brand" href="#overview" id="brand">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      <span class="brand-name" data-ui="site.name">Square One</span>
    </a>
    <div class="crumb" id="crumb" aria-hidden="true"></div>
    <div class="presenter-dock" id="presenter-dock" role="toolbar" aria-label="Presenter controls" hidden></div>
    <div class="top-actions">
      <button class="top-btn" id="goto-btn" type="button" aria-haspopup="dialog" aria-keyshortcuts="G">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="label" data-ui="nav.goto">Go to</span><kbd aria-hidden="true">G</kbd>
      </button>
      <button class="top-btn" id="challenge-btn" type="button" aria-keyshortcuts="C">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2c2.6.4 4.5 2.8 4.5 5.8"/></svg>
        <span class="label" data-ui="nav.challenge">Class challenge</span>
      </button>
      <button class="top-btn" id="presenter-btn" type="button" aria-pressed="false" aria-keyshortcuts="P">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <span class="label" data-ui="nav.presenter">Presenter</span>
      </button>
      <button class="icon-btn" id="settings-btn" type="button" aria-haspopup="dialog">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span class="sr-only" data-ui="nav.settings">Display</span>
      </button>
      <button class="icon-btn" id="keys-btn" type="button" aria-haspopup="dialog" aria-keyshortcuts="?">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
        <span class="sr-only" data-ui="nav.shortcuts">Keyboard shortcuts</span>
      </button>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="outline" id="outline" aria-label="Lessons"></nav>
  <div class="scrim" id="scrim" hidden></div>

  <main class="stage" id="stage">
    <div class="lesson-head" id="lesson-head"></div>

    <section class="board-col" id="board-col" aria-label="Chessboard and controls">
      <div class="statusbar" id="statusbar"></div>
      <div class="board-frame" id="board-frame">
        <div class="coords coords-ranks" id="coords-ranks" aria-hidden="true"></div>
        <div class="board-wrap" id="board-wrap">
          <div class="board" id="board" role="grid" aria-describedby="board-help"></div>
          <div class="pieces" id="pieces" aria-hidden="true"></div>
          <svg class="overlay" id="overlay" viewBox="0 0 8 8" aria-hidden="true" focusable="false"></svg>
          <svg class="annotate" id="annotate" viewBox="0 0 8 8" aria-hidden="true" focusable="false"></svg>
        </div>
        <div class="coords coords-files" id="coords-files" aria-hidden="true"></div>
        <div class="board-banner" id="board-banner" hidden></div>
      </div>
      <p class="sr-only" id="board-help"></p>
      <div class="toolbar" id="toolbar" role="toolbar" aria-label="Board controls"></div>
      <div class="legend" id="legend" hidden></div>
      <div id="feedback-mobile-slot"></div>
    </section>

    <section class="panel" id="lesson-panel" tabindex="-1" aria-labelledby="lesson-title">
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      <div class="panel-body" id="panel-body"></div>
    </section>
  </main>
</div>

<div class="part-card" id="part-card" role="status" hidden></div>

<dialog id="goto-dialog" aria-labelledby="goto-title">
  <div class="dlg-head"><h2 id="goto-title" data-ui="nav.goto">Go to</h2><button class="dlg-close" type="button" data-close><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="sr-only" data-ui="nav.close">Close</span></button></div>
  <div class="dlg-body">
    <label class="sr-only" for="goto-input" data-ui="nav.goto.placeholder">Search lessons and examples</label>
    <input class="goto-input" id="goto-input" type="search" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="goto-list" aria-autocomplete="list">
    <ul class="goto-list" id="goto-list" role="listbox" aria-label="Results"></ul>
  </div>
</dialog>

<dialog id="settings-dialog" aria-labelledby="settings-title">
  <div class="dlg-head"><h2 id="settings-title" data-ui="nav.settings">Display</h2><button class="dlg-close" type="button" data-close><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="sr-only" data-ui="nav.close">Close</span></button></div>
  <div class="dlg-body" id="settings-body"></div>
</dialog>

<dialog id="keys-dialog" aria-labelledby="keys-title">
  <div class="dlg-head"><h2 id="keys-title" data-ui="keys.title">Keyboard shortcuts</h2><button class="dlg-close" type="button" data-close><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="sr-only" data-ui="nav.close">Close</span></button></div>
  <div class="dlg-body" id="keys-body"></div>
</dialog>

<dialog id="promo-dialog" aria-labelledby="promo-title" aria-describedby="promo-help">
  <div class="dlg-head"><h2 id="promo-title" data-ui="promo.title">Promote your pawn</h2><button class="dlg-close" type="button" data-close><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="sr-only" data-ui="promo.cancel">Cancel move</span></button></div>
  <div class="dlg-body"><p id="promo-help" data-ui="promo.help">Choose what the pawn becomes.</p><div class="promo-grid" id="promo-grid"></div></div>
</dialog>

<div class="sr-only" id="announcer" aria-live="assertive"></div>

<script src="content.js"></script>
<script src="js/engine.js"></script>
<script src="js/pieces.js"></script>
<script src="js/lessons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
